# Install only in an independently governed observer repository. repository_dispatch must be sent
# by the allowlisted GitHub App webhook bridge; caller payload identifiers are verified via API.

name: sentinel-observer

on:
  repository_dispatch:
    types: [sentinel-observe]

permissions:
  contents: read

concurrency:
  group: sentinel-observer-state
  cancel-in-progress: false

jobs:
  observe:
    if: github.event_name == 'repository_dispatch'
    runs-on: [self-hosted, trinity-trusted-observer]
    steps:
      - name: Require immutable trusted observer configuration
        shell: bash
        env:
          SOURCE_REPO: ${{ vars.OBSERVER_SOURCE_REPOSITORY }}
          SOURCE_SHA: ${{ vars.OBSERVER_SOURCE_SHA }}
          INCIDENT_CONFIG: ./.incident-service/config.json
          INCIDENT_STATE_DIR: ./.incident-service/state
        run: |
          set -euo pipefail
          test -n "$SOURCE_REPO"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -f "$INCIDENT_CONFIG"
          test -d "$INCIDENT_STATE_DIR"
          test ! -L "$INCIDENT_CONFIG"
          test ! -L "$INCIDENT_STATE_DIR"
          umask 077
          mkdir -p ./.trinity-runtime
          chmod 700 ./.trinity-runtime

      - name: Check out independently governed observer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.OBSERVER_SOURCE_REPOSITORY }}
          ref: ${{ vars.OBSERVER_SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 1
          path: ./trusted-observer

      - name: Authorize immutable dispatch sender and observer repository IDs
        shell: bash
        env:
          SOURCE_SHA: ${{ vars.OBSERVER_SOURCE_SHA }}
          INCIDENT_CONFIG: ./.incident-service/config.json
          OBSERVER_SENDER_ID: ${{ github.actor_id }}
          OBSERVER_REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          test "$(git -C ./trusted-observer rev-parse HEAD)" = "$SOURCE_SHA"
          python3 - "$INCIDENT_CONFIG" "$OBSERVER_SENDER_ID" "$OBSERVER_REPOSITORY_ID" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, './trusted-observer')
          from tools.incident_store import authorize_source, load_config
          authorize_source(load_config(Path(sys.argv[1])), sender_id=sys.argv[2], source_repository_id=sys.argv[3])
          PY

      - name: Authenticate target run, repository, actor, ref, and commit through GitHub API
        id: target
        shell: bash
        env:
          GH_APP_TOKEN: ${{ secrets.OBSERVER_APP_TOKEN }}
          REQUEST_JSON: ${{ toJSON(github.event.client_payload) }}
        run: |
          set -euo pipefail
          test -n "$GH_APP_TOKEN"
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          request = json.loads(os.environ['REQUEST_JSON'])
          if set(request) != {'repository_id', 'run_attempt', 'run_id'}:
              raise SystemExit('observer request has unexpected fields')
          for name in ('repository_id', 'run_attempt', 'run_id'):
              if isinstance(request[name], bool) or not isinstance(request[name], int) or not 1 <= request[name] <= 2**63 - 1:
                  raise SystemExit(f'{name} is not a positive signed 64-bit integer')
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_APP_TOKEN']}",
              'X-GitHub-Api-Version': '2022-11-28',
          }
          def api(path):
              with urllib.request.urlopen(urllib.request.Request(f'https://api.github.com{path}', headers=headers), timeout=20) as response:
                  return json.load(response)
          repository = api(f"/repositories/{request['repository_id']}")
          full_name = repository['full_name']
          run = api(f"/repos/{full_name}/actions/runs/{request['run_id']}/attempts/{request['run_attempt']}")
          if run['repository']['id'] != repository['id'] or run['id'] != request['run_id'] or run['run_attempt'] != request['run_attempt']:
              raise SystemExit('GitHub API run binding mismatch')
          if run['event'] not in {'push', 'pull_request'}:
              raise SystemExit('unsupported producer event')
          commit = api(f"/repos/{full_name}/commits/{run['head_sha']}")
          if commit['sha'] != run['head_sha']:
              raise SystemExit('GitHub API commit binding mismatch')
          changed = sorted({item['filename'] for item in commit.get('files', [])})
          if len(changed) >= 300:
              raise SystemExit('commit file list reached the API completeness bound')
          Path('./.trinity-runtime/changed-paths').write_text('\n'.join(changed), encoding='utf-8')
          authenticated = {
              'actor_id': str(run['actor']['id']),
              'actor_login': run['actor']['login'],
              'commit_sha': run['head_sha'],
              'occurred_at': run['run_started_at'],
              'repository': full_name,
              'repository_id': str(repository['id']),
              'run_attempt': run['run_attempt'],
              'run_id': str(run['id']),
          }
          Path('./.trinity-runtime/authenticated-run.json').write_text(json.dumps(authenticated, sort_keys=True), encoding='utf-8')
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write(f"repository={full_name}\nsha={run['head_sha']}\n")
          PY

      - name: Authorize API-resolved target repository ID
        shell: bash
        env:
          INCIDENT_CONFIG: ./.incident-service/config.json
        run: |
          set -euo pipefail
          python3 - "$INCIDENT_CONFIG" <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, './trusted-observer')
          from tools.incident_store import authorize_target, load_config
          authenticated = json.loads(Path('./.trinity-runtime/authenticated-run.json').read_text(encoding='utf-8'))
          authorize_target(load_config(Path(sys.argv[1])), authenticated['repository_id'])
          PY

      - name: Check out authenticated candidate commit as immutable data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.target.outputs.repository }}
          ref: ${{ steps.target.outputs.sha }}
          token: ${{ secrets.OBSERVER_APP_TOKEN }}
          persist-credentials: false
          submodules: false
          fetch-depth: 1
          path: ./candidate-data

      - name: Run reviewed static probe without candidate execution
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C ./candidate-data rev-parse HEAD)" = "${{ steps.target.outputs.sha }}"
          python3 ./trusted-observer/tools/incident_probe.py ./candidate-data --changed-paths ./.trinity-runtime/changed-paths > ./.trinity-runtime/probe.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          authenticated = json.loads(Path('./.trinity-runtime/authenticated-run.json').read_text(encoding='utf-8'))
          probe = json.loads(Path('./.trinity-runtime/probe.json').read_text(encoding='utf-8'))
          if probe['codes']:
              event = {**authenticated, 'evidence_digest': probe['evidence_digest'], 'finding_codes': probe['codes'], 'schema': 'trinity.sentinel-incident/v1'}
              Path('./.trinity-runtime/incident.json').write_text(json.dumps(event, sort_keys=True, separators=(',', ':')), encoding='utf-8')
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write(f"has_incident={'true' if probe['codes'] else 'false'}\n")
          PY

      - name: Admit authenticated incident to durable state
        if: steps.probe.outputs.has_incident == 'true'
        shell: bash
        env:
          INCIDENT_CONFIG: ./.incident-service/config.json
          OBSERVER_SENDER_ID: ${{ github.actor_id }}
          OBSERVER_REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          python3 ./trusted-observer/tools/incident_store.py ingest --config "$INCIDENT_CONFIG" --event ./.trinity-runtime/incident.json --sender-id "$OBSERVER_SENDER_ID" --source-repository-id "$OBSERVER_REPOSITORY_ID"
