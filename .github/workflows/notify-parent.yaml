name: Notify parent

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      parents:
        description: "Space-separated parent list overriding TRINITY_PARENTS for this run only."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: notify-parent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch submodule-updated to parent repo(s)
        env:
          # The registered parents live in the repository variable TRINITY_PARENTS as a
          # space-separated list, so registering a parent is a settings change rather than
          # a commit to this repository. PARENTS_FALLBACK is only the roster used when that
          # variable is unset, and a workflow_dispatch input overrides both for one run.
          PARENTS_INPUT: ${{ inputs.parents }}
          PARENTS_VAR: ${{ vars.TRINITY_PARENTS }}
          PARENTS_FALLBACK: "EtharaOrion/levi EtharaOrion/deku EtharaOrion/anubis EtharaOrion/teresa EtharaOrion/kakashi EtharaOrion/thanatos EtharaOrion/kanao EtharaOrion/yuji EtharaOrion/argos EtharaOrion/envora"
          GH_TOKEN: ${{ secrets.PARENT_DISPATCH_TOKEN }}
        run: |
          set -uo pipefail

          PARENTS="${PARENTS_INPUT}"
          [ -n "${PARENTS}" ] || PARENTS="${PARENTS_VAR}"
          [ -n "${PARENTS}" ] || PARENTS="${PARENTS_FALLBACK}"

          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::PARENT_DISPATCH_TOKEN is unset, so no parent can be notified."
            exit 1
          fi

          PAYLOAD="$(jq -nc \
                --arg repo "$GITHUB_REPOSITORY" \
                --arg sha  "$GITHUB_SHA" \
                --arg ref  "$GITHUB_REF_NAME" \
                '{event_type:"submodule-updated",
                  client_payload:{repo:$repo, sha:$sha, ref:$ref}}')"

          BODY="${RUNNER_TEMP}/dispatch-response"
          NOTIFIED=""
          FAILED=""

          # Every parent is attempted. A refusal is recorded and the loop continues, so one
          # unreachable parent never hides the rest; the step fails once at the end instead.
          for PARENT in ${PARENTS}; do
            echo "Dispatching to ${PARENT} ..."
            CODE="$(curl -sS -o "${BODY}" -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${PARENT}/dispatches" \
              -d "${PAYLOAD}")" || CODE="000"

            if [ "${CODE}" = "204" ]; then
              NOTIFIED="${NOTIFIED} ${PARENT}"
            else
              FAILED="${FAILED} ${PARENT}"
              echo "::error::${PARENT} refused the dispatch with HTTP ${CODE}: $(tr -d '\n' < "${BODY}" | cut -c1-300)"
            fi
          done
          rm -f "${BODY}"

          {
            echo "### Parent propagation"
            echo
            echo "From \`${GITHUB_REPOSITORY}\` @ \`${GITHUB_SHA}\`."
            echo
            for PARENT in ${NOTIFIED}; do echo "- notified \`${PARENT}\`"; done
            for PARENT in ${FAILED}; do echo "- REFUSED \`${PARENT}\`"; done
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Notified:${NOTIFIED:-" none"} (from ${GITHUB_REPOSITORY} @ ${GITHUB_SHA})."

          if [ -n "${FAILED}" ]; then
            echo "::error::These parents were not notified:${FAILED}"
            exit 1
          fi
